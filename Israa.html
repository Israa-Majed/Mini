<body>
    <img width="200" src="imag.jpeg">
    <h1>Creat Your Account</h1>
    <p>It's quick and easy.</p>
    <form target="_blank">
         <div>
        <label for="txt">Full Name</label>
        <br>
        <input required id="txt" type="text" name="text" placeholder="Enter your full name">
    </div>
    <div>
        <label required for="email">Email</label>
        <br>
        <input required id="email" type="email" name="email" placeholder="Enter your email">
    </div>
    <div>
        <label for="pass">Password</label>
        <br>
        <input id="pass" type="password" name="password" placeholder="Enter your password">
    </div>
    <div>
        <label>Gender</label>
        <br>
        <input id="m" type="radio" name="gen">
        <label for="m">Male</label>
        <input id="f" type="radio" name="gen">
        <label for="f">Fmale</label>
    </div>
    <div>
        <label>Skills</label>
        <br>
        <input id="h" type="checkbox" name="lang">
        <label for="h">HTML</label>
        <input id="c" type="checkbox" name="lang">
        <label for="c">CSS</label>
        <input id="j" type="checkbox" name="lang">
        <label for="j">JavaScript</label>
    </div>
    <a href="Israa2.html">Register</a>
    </form>
